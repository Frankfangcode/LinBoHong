<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文作文診斷報告：Study at Home vs. Cafe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        .card-hover:hover { transform: translateY(-2px); transition: all 0.2s; }
        
        /* Paper View Specific Styles */
        .paper-del {
            text-decoration: line-through;
            color: #ef4444; /* red-500 */
            text-decoration-thickness: 2px;
            margin-right: 4px;
            opacity: 0.7;
        }
        .paper-add {
            color: #dc2626; /* red-600 */
            font-weight: bold;
            margin-right: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const BookOpen = (props) => (
            <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></IconBase>
        );
        const AlertCircle = (props) => (
            <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></IconBase>
        );
        const FileText = (props) => (
            <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconBase>
        );
        const ArrowRight = (props) => (
            <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></IconBase>
        );
        const Award = (props) => (
            <IconBase {...props}><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></IconBase>
        );
        const BarChart2 = (props) => (
             <IconBase {...props}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></IconBase>
        );
        const PenTool = (props) => (
            <IconBase {...props}><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></IconBase>
        );
        const Edit3 = (props) => (
            <IconBase {...props}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></IconBase>
        );
        const Copy = (props) => (
            <IconBase {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></IconBase>
        );

        // Data
        const correctionData = {
            title: "Study at Home vs. Study in a Cafe",
            studentName: "澤享",
            score: {
                total: "13",
                max: 20,
                breakdown: [
                    { label: "內容 Content", score: 4, max: 5, status: "good" },
                    { label: "組織 Organization", score: 4, max: 5, status: "good" },
                    { label: "文法句構 Grammar", score: 2, max: 5, status: "warn" },
                    { label: "字彙拼字 Vocabulary", score: 3, max: 5, status: "avg" }
                ]
            },
            summary: "內容完整切題，比較了兩者優缺點並說明偏好。主要問題在於動詞時態（prefer/prefers）、搭配詞（let people more concentrate -> help people concentrate more）以及拼字（studing, laze）。若能修正這些基本錯誤，分數可達 15 分以上。",
            corrections: [
                { id: 1, original: "Everyone prefer", corrected: "Everyone prefers", explanation: "主動詞一致性 (S-V Agreement)。Everyone 是單數代名詞，動詞需加 s。", type: "Grammar" },
                { id: 2, original: "different place", corrected: "different places", explanation: "名詞單複數。Different 後面通常接複數名詞。", type: "Grammar" },
                { id: 3, original: "studying schoolwork", corrected: "studying", explanation: "贅字。'Study' 本身就隱含讀書/做功課的意思，不需要加 schoolwork。", type: "Vocab" },
                { id: 4, original: "let people more concentrate", corrected: "help people concentrate more", explanation: "語序與搭配詞。'Let' 通常接原形動詞但語意較被動，這裡用 'help' 更適合；'more' 修飾動詞 concentrate 時應放在後面。", type: "Grammar" },
                { id: 5, original: "be laze", corrected: "be lazy", explanation: "詞性錯誤。Laze 是動詞，形容詞是 lazy。", type: "Grammar" },
                { id: 6, original: "in your presence", corrected: "right there", explanation: "語氣不自然。'In your presence' 太過正式且通常指人，描述床的位置用 'right there' 或 'right beside you' 即可。", type: "Vocab" },
                { id: 7, original: "make you distract", corrected: "distract you", explanation: "受詞與動詞搭配。Distract 是及物動詞，直接說 'distract you' 即可，不需要 'make you'。", type: "Grammar" },
                { id: 8, original: "studing", corrected: "studying", explanation: "拼字錯誤。Study 去 y 加 ing 是錯的，應直接加 ing。", type: "Spelling" },
                { id: 9, original: "supply your energy", corrected: "replenish your energy", explanation: "搭配詞。補充精力常用 'replenish' 或 'boost'。", type: "Vocab" },
                { id: 10, original: "Bring about your work is not efficient", corrected: "As a result, you may work less efficiently", explanation: "句構混亂。原句中英直譯嚴重。改用轉折詞 'As a result' 連接，並用副詞 'efficiently' 修飾動詞。", type: "Structure" },
                { id: 11, original: "Because it is...", corrected: "This is because it is...", explanation: "片段句 (Fragment)。Because 引導的子句不能單獨存在，需連接主句或改為 'This is because...'。", type: "Grammar" },
                { id: 12, original: "who work hard", corrected: "who works hard", explanation: "關係子句主動詞一致。先行詞 a person 是單數，關係子句動詞用 works。", type: "Grammar" },
                { id: 13, original: "place which have", corrected: "place that has", explanation: "主動詞一致與代名詞。Place 是單數用 has；限定用法用 that 比 which 自然。", type: "Grammar" },
                { id: 14, original: "Least but not least", corrected: "Last but not least", explanation: "慣用語錯誤。應為 'Last' (最後但同樣重要)。", type: "Vocab" },
                { id: 15, original: "astmosphere", corrected: "atmosphere", explanation: "拼字錯誤。", type: "Spelling" }
            ],
            finalText: {
                p1: "Everyone prefers to study or work in different places. Picture A shows a girl studying in her own room. There are several pros and cons. For example, the atmosphere is tranquil, which can help people concentrate more on their work. However, you may be lazy because the bed is right there, which can distract you and tempt you to take a nap. Picture B shows a man studying in a café. One advantage is that you can replenish your energy by eating some food or drinking coffee, which can refresh your spirits and give you more motivation to work. Nonetheless, a disadvantage is that there are many people chatting, and you may be disturbed. As a result, you may work less efficiently.",
                p2: "From my perspective, I prefer to study at home. This is because it is more beneficial for me. To start with, I am a person who works hard and wants to achieve good grades, so I need a place that has many reference books so that I can use them at any time. On top of that, my mom cooks lunch and dinner for me, so I can save money and don't need to spend more money eating out. Last but not least, I like the atmosphere in my room, which helps me focus on my homework, and the efficiency can be higher than in other places. All in all, studying at home is the best option for me because it helps me focus more on my work."
            },
            paperData: [
                {
                    type: 'paragraph',
                    lines: [
                        [
                            { text: "Everyone " },
                            { text: "prefer", type: "del" },
                            { text: "prefers", type: "add" },
                            { text: " to study or work in " },
                            { text: "different place", type: "del" },
                            { text: "different places", type: "add" },
                            { text: " . Picture A shows a girl " },
                            { text: "studying schoolwork", type: "del" },
                            { text: "studying", type: "add" },
                            { text: " in her own room . There are several pros and cons . For example , the atmosphere is tranquil , which can " },
                            { text: "let people more concentrate", type: "del" },
                            { text: "help people concentrate more", type: "add" },
                            { text: " on their work . However , you may " },
                            { text: "be laze", type: "del" },
                            { text: "be lazy", type: "add" },
                            { text: " because the bed is " },
                            { text: "in your presence", type: "del" },
                            { text: "right there", type: "add" },
                            { text: " , which can " },
                            { text: "make you distract", type: "del" },
                            { text: "distract you", type: "add" },
                            { text: " and " },
                            { text: "want to take a rest", type: "del" },
                            { text: "tempt you to take a nap", type: "add" },
                            { text: " . Picture B shows a man " },
                            { text: "studing", type: "del" },
                            { text: "studying", type: "add" },
                            { text: " in a " },
                            { text: "cafe", type: "del" },
                            { text: "café", type: "add" },
                            { text: " , " },
                            { text: "the advantages are that", type: "del" },
                            { text: "one advantage is that", type: "add" },
                            { text: " you can " },
                            { text: "supply", type: "del" },
                            { text: "replenish", type: "add" },
                            { text: " your energy by eating some food or drinking coffee , which can refresh " },
                            { text: "you", type: "del" },
                            { text: "your", type: "add" },
                            { text: " spirits and " },
                            { text: "have", type: "del" },
                            { text: "give you", type: "add" },
                            { text: " more motivation to do your work . Nonetheless , " },
                            { text: "the disadvantages are", type: "del" },
                            { text: "a disadvantage is", type: "add" },
                            { text: " that there are many people chatting , and you may be disturbed . " },
                            { text: "Bring about your work is not efficient", type: "del" },
                            { text: "As a result, you may work less efficiently", type: "add" },
                            { text: " ." }
                        ]
                    ]
                },
                {
                    type: 'paragraph',
                    lines: [
                        [
                            { text: "From my perspective , I prefer to study at home . " },
                            { text: "Because", type: "del" },
                            { text: "This is because", type: "add" },
                            { text: " it is more beneficial for me . To start with , I am a person who " },
                            { text: "work hard", type: "del" },
                            { text: "works hard", type: "add" },
                            { text: " and " },
                            { text: "want to gain good academic performance", type: "del" },
                            { text: "wants to achieve good grades", type: "add" },
                            { text: " , so I need a place " },
                            { text: "which have", type: "del" },
                            { text: "that has", type: "add" },
                            { text: " many reference books , " },
                            { text: "so that", type: "del" },
                            { text: "so", type: "add" },
                            { text: " I can use them at any time . On top of that , my mom will " },
                            { text: "cook a lunch", type: "del" },
                            { text: "cooks lunch", type: "add" },
                            { text: " and dinner for me , so I can save " },
                            { text: "some", type: "del" },
                            { text: " ", type: "add" },
                            { text: "money , and don't need to " },
                            { text: "spent", type: "del" },
                            { text: "spend", type: "add" },
                            { text: " more money " },
                            { text: "to eat outside", type: "del" },
                            { text: "eating out", type: "add" },
                            { text: " . " },
                            { text: "Least", type: "del" },
                            { text: "Last", type: "add" },
                            { text: " but not least , I like the " },
                            { text: "astmosphere", type: "del" },
                            { text: "atmosphere", type: "add" },
                            { text: " in my room , which " },
                            { text: "can let me", type: "del" },
                            { text: "helps me", type: "add" },
                            { text: " focus on my homework , and the " },
                            { text: "effiency", type: "del" },
                            { text: "efficiency", type: "add" },
                            { text: " can be higher than " },
                            { text: "other place", type: "del" },
                            { text: "in other places", type: "add" },
                            { text: " . All in all , studying at home is the best option for me , " },
                            { text: "which can let me more focus on my work", type: "del" },
                            { text: "because it helps me focus more on my work", type: "add" },
                            { text: " ." }
                        ]
                    ]
                }
            ]
        };

        const ScoreCard = ({ label, score, max, status }) => {
            const width = (score / max) * 100 + '%';
            return (
                <div className="mb-4">
                    <div className="flex justify-between text-sm font-medium mb-1 text-gray-700">
                        <span>{label}</span>
                        <span>{score} / {max}</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${status === 'good' ? 'bg-green-500' : status === 'warn' ? 'bg-red-500' : 'bg-yellow-500'}`} style={{ width }}></div>
                    </div>
                </div>
            );
        };

        const CorrectionCard = ({ item }) => (
            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 card-hover">
                <div className="flex items-start gap-3">
                    <div className={`mt-1 p-1.5 rounded-full shrink-0 ${item.type === 'Grammar' ? 'bg-blue-100 text-blue-600' : item.type === 'Spelling' ? 'bg-red-100 text-red-600' : 'bg-purple-100 text-purple-600'}`}>
                        {item.type === 'Grammar' ? <BookOpen size={16} /> : item.type === 'Spelling' ? <AlertCircle size={16} /> : <FileText size={16} />}
                    </div>
                    <div className="flex-1">
                        <div className="flex flex-col md:flex-row md:items-center gap-2 mb-2">
                            <div className="flex-1 bg-red-50 rounded px-3 py-2 text-red-800 line-through decoration-red-400 decoration-2 bg-opacity-20">
                                {item.original}
                            </div>
                            <ArrowRight className="hidden md:block text-gray-400" size={20} />
                            <div className="flex-1 bg-green-50 rounded px-3 py-2 text-green-800 font-medium border border-green-200">
                                {item.corrected}
                            </div>
                        </div>
                        <p className="text-gray-600 text-sm mt-2 flex items-start gap-2">
                            <span className="bg-gray-100 text-gray-500 text-xs px-2 py-0.5 rounded uppercase tracking-wide font-bold mt-0.5">{item.type}</span>
                            {item.explanation}
                        </p>
                    </div>
                </div>
            </div>
        );

        const PaperView = ({ data }) => (
            <div className="bg-white rounded-xl shadow-lg border border-gray-200 p-8 md:p-12 overflow-hidden relative">
                 <div className="absolute top-0 left-0 w-full h-2 bg-red-500 opacity-80"></div>
                 <h2 className="text-2xl font-serif font-bold text-gray-800 mb-8 border-b border-gray-100 pb-4 text-center">Correction Paper</h2>
                 
                 <div className="font-serif text-lg leading-loose text-gray-800 space-y-6">
                    {data.map((para, pIdx) => (
                        <div key={pIdx}>
                            {para.lines.map((line, lIdx) => (
                                <span key={lIdx}>
                                    {line.map((segment, sIdx) => {
                                        if (segment.type === 'del') {
                                            return <span key={sIdx} className="paper-del">{segment.text}</span>;
                                        } else if (segment.type === 'add') {
                                            return <span key={sIdx} className="paper-add">{segment.text}</span>;
                                        } else {
                                            return <span key={sIdx}>{segment.text}</span>;
                                        }
                                    })}
                                    {/* Add space between sentences if not last line */}
                                    {" "}
                                </span>
                            ))}
                        </div>
                    ))}
                 </div>

                 <div className="mt-12 pt-6 border-t border-gray-100 flex justify-end">
                    <div className="text-right">
                        <div className="text-red-600 font-handwriting text-4xl font-bold -rotate-12 inline-block border-4 border-red-600 rounded-full p-2 px-4 shadow-sm opacity-80">
                            {correctionData.score.total}
                        </div>
                        <p className="text-red-500 font-serif text-sm mt-2">Score</p>
                    </div>
                 </div>
            </div>
        );
        
        const PracticeView = ({ paperData }) => {
            const [originalText, setOriginalText] = useState('');
            
            useEffect(() => {
                // Reconstruct original text from paperData
                const text = paperData.map(para => {
                    return para.lines.map(line => {
                        return line.map(segment => {
                            if (segment.type !== 'add') {
                                return segment.text;
                            }
                            return '';
                        }).join('');
                    }).join(' ');
                }).join('\n\n');
                
                setOriginalText(text);
            }, [paperData]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(originalText);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                        <div className="bg-gray-50 px-5 py-3 border-b border-gray-100 flex justify-between items-center">
                            <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                <FileText size={18} className="text-gray-500"/> 原始文章 (Original)
                            </h3>
                            <button 
                                onClick={copyToClipboard}
                                className="text-gray-500 hover:text-blue-600 text-sm flex items-center gap-1 transition-colors"
                                title="複製原文"
                            >
                                <Copy size={16}/> 複製
                            </button>
                        </div>
                        <div className="p-6 font-serif text-lg leading-relaxed text-gray-800 whitespace-pre-wrap flex-1 overflow-y-auto">
                            {originalText}
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                         <div className="bg-blue-50 px-5 py-3 border-b border-blue-100">
                            <h3 className="font-bold text-blue-800 flex items-center gap-2">
                                <Edit3 size={18} className="text-blue-600"/> 練習區 (Practice Here)
                            </h3>
                        </div>
                        <textarea 
                            className="w-full h-96 lg:h-full p-6 font-serif text-lg leading-relaxed text-gray-800 resize-none focus:outline-none focus:bg-gray-50 transition-colors"
                            placeholder="請在此處試著重寫你的文章..."
                        ></textarea>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('corrections'); // corrections, paper, final, practice

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    {/* Header */}
                    <header className="text-center mb-10">
                        <h1 className="text-3xl font-bold text-gray-900 mb-2">{correctionData.title}</h1>
                        <p className="text-gray-500">作文批改與診斷報告</p>
                    </header>

                    {/* Dashboard Section */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* Total Score */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col items-center justify-center">
                            <div className="text-gray-500 font-medium mb-2">預估級分</div>
                            <div className="text-5xl font-bold text-blue-600 mb-2">{correctionData.score.total}</div>
                            <div className="text-sm text-gray-400">滿分 {correctionData.score.max}</div>
                        </div>

                        {/* Breakdown */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:col-span-2">
                            <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <BarChart2 size={20} /> 評分細項
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">
                                {correctionData.score.breakdown.map((item, idx) => (
                                    <ScoreCard key={idx} {...item} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Summary Box */}
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-8 rounded-r-lg">
                        <div className="flex items-start gap-3">
                            <Award className="text-blue-600 shrink-0 mt-1" />
                            <div>
                                <h4 className="font-bold text-blue-800 mb-1">總評</h4>
                                <p className="text-blue-800 text-opacity-80">{correctionData.summary}</p>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Tabs */}
                    <div className="mb-6 border-b border-gray-200 overflow-x-auto">
                        <div className="flex gap-6 min-w-max">
                            <button 
                                onClick={() => setActiveTab('corrections')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'corrections' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><BookOpen size={18}/> 逐句批改診斷</span>
                                {activeTab === 'corrections' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('paper')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'paper' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><PenTool size={18}/> 試卷批改模式</span>
                                {activeTab === 'paper' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                             <button 
                                onClick={() => setActiveTab('practice')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'practice' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><Edit3 size={18}/> 自我練習模式</span>
                                {activeTab === 'practice' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('final')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'final' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><FileText size={18}/> 修正後範文</span>
                                {activeTab === 'final' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                        </div>
                    </div>

                    {/* Tab Content */}
                    {activeTab === 'corrections' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">診斷與修正 ({correctionData.corrections.length})</h2>
                                <span className="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">紅色為原文錯誤，綠色為修正建議</span>
                            </div>
                            <div>
                                {correctionData.corrections.map(item => (
                                    <CorrectionCard key={item.id} item={item} />
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {activeTab === 'paper' && (
                        <PaperView data={correctionData.paperData} />
                    )}
                    
                    {activeTab === 'practice' && (
                        <PracticeView paperData={correctionData.paperData} />
                    )}

                    {activeTab === 'final' && (
                        <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                            <div className="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                                <h2 className="font-bold text-gray-700">高分範文版 (Revised Version)</h2>
                                <button className="text-blue-600 text-sm font-medium hover:underline" onClick={() => navigator.clipboard.writeText(correctionData.finalText.p1 + '\n\n' + correctionData.finalText.p2)}>複製全文</button>
                            </div>
                            <div className="p-8 leading-relaxed text-gray-800 text-lg space-y-6">
                                <p>{correctionData.finalText.p1}</p>
                                <p>{correctionData.finalText.p2}</p>
                            </div>
                            <div className="bg-blue-50 px-6 py-4 border-t border-blue-100">
                                <p className="text-sm text-blue-800">💡 <strong>小提示：</strong> 閱讀範文時，請特別注意轉折詞 (On the one hand, Furthermore) 與動詞時態的使用。</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
