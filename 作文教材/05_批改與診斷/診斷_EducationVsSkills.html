                            { text: "indicates", type: "add" },
                            { text: " that the person " },
                            { text: "work", type: "del" },
                            { text: "works", type: "add" },
                            { text: " hard, they may " },
                            { text: "don't", type: "del" },
                            { text: "not", type: "add" },
                            { text: " have " },
                            { text: "aduquate", type: "del" },
                            { text: "adequate", type: "add" },
                            { text: " capability to fit the job. For instance, a senior engineer might " },
                            { text: "sovle", type: "del" },
                            { text: "solve", type: "add" },
                            { text: " a technical " },
                            { text: "problems", type: "del" },
                            { text: "problem", type: "add" },
                            { text: " in " },
                            { text: "few", type: "del" },
                            { text: "a few", type: "add" },
                            { text: " minutes due to his abundant work experience. While people graduate with high academic qualifications, they " },
                            { text: "don't experience", type: "del" },
                            { text: "have not experienced", type: "add" },
                            { text: " this situation before. They need to spend " },
                            { text: "many time", type: "del" },
                            { text: "much time", type: "add" },
                            { text: " on finding the cause and " },
                            { text: "solve", type: "del" },
                            { text: "solving", type: "add" },
                            { text: " it. As mentioned above, I believe that not only is an academic degree necessary for getting a job, but practical experience is also essential for long-term success." }
                        ]
                    ]
                }
            ]
        };

        const ScoreCard = ({ label, score, max, status }) => {
            const width = (score / max) * 100 + '%';
            return (
                <div className="mb-4">
                    <div className="flex justify-between text-sm font-medium mb-1 text-gray-700">
                        <span>{label}</span>
                        <span>{score} / {max}</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${status === 'good' ? 'bg-green-500' : status === 'warn' ? 'bg-red-500' : 'bg-yellow-500'}`} style={{ width }}></div>
                    </div>
                </div>
            );
        };

        const CorrectionCard = ({ item }) => (
            <div className={`bg-white rounded-lg shadow-sm border ${item.type === 'Good' ? 'border-green-200 bg-green-50' : 'border-gray-200'} p-4 mb-4 card-hover`}>
                <div className="flex items-start gap-3">
                    <div className={`mt-1 p-1.5 rounded-full shrink-0 ${item.type === 'Grammar' ? 'bg-blue-100 text-blue-600' : item.type === 'Spelling' ? 'bg-red-100 text-red-600' : item.type === 'Good' ? 'bg-green-100 text-green-600' : 'bg-purple-100 text-purple-600'}`}>
                        {item.type === 'Grammar' ? <BookOpen size={16} /> : item.type === 'Spelling' ? <AlertCircle size={16} /> : item.type === 'Good' ? <CheckCircle size={16} /> : <FileText size={16} />}
                    </div>
                    <div className="flex-1">
                        {item.type !== 'Good' ? (
                            <div className="flex flex-col md:flex-row md:items-center gap-2 mb-2">
                                <div className="flex-1 bg-red-50 rounded px-3 py-2 text-red-800 line-through decoration-red-400 decoration-2 bg-opacity-20">
                                    {item.original}
                                </div>
                                <ArrowRight className="hidden md:block text-gray-400" size={20} />
                                <div className="flex-1 bg-green-50 rounded px-3 py-2 text-green-800 font-medium border border-green-200">
                                    {item.corrected}
                                </div>
                            </div>
                        ) : (
                             <div className="mb-2 bg-green-100 rounded px-3 py-2 text-green-800 font-medium border border-green-200">
                                {item.original}
                            </div>
                        )}
                        <p className="text-gray-600 text-sm mt-2 flex items-start gap-2">
                            <span className={`text-xs px-2 py-0.5 rounded uppercase tracking-wide font-bold mt-0.5 ${item.type === 'Good' ? 'bg-green-200 text-green-700' : 'bg-gray-100 text-gray-500'}`}>{item.type === 'Good' ? 'Excellent' : item.type}</span>
                            {item.explanation}
                        </p>
                    </div>
                </div>
            </div>
        );

        const PaperView = ({ data, paperMode, setPaperMode }) => (
            <div className="bg-white rounded-xl shadow-lg border border-gray-200 p-8 md:p-12 overflow-hidden relative">
                 <div className="absolute top-0 left-0 w-full h-2 bg-red-500 opacity-80"></div>
                 
                 <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-100 pb-4">
                    <h2 className="text-2xl font-serif font-bold text-gray-800">Correction Paper</h2>
                    
                    <div className="flex gap-2 mt-4 md:mt-0">
                        <button 
                            onClick={() => setPaperMode('full')}
                            className={`toggle-btn ${paperMode === 'full' ? 'toggle-btn-active' : 'toggle-btn-inactive'}`}
                        >
                            完整批改
                        </button>
                        <button 
                            onClick={() => setPaperMode('minimal')}
                            className={`toggle-btn ${paperMode === 'minimal' ? 'toggle-btn-active' : 'toggle-btn-inactive'}`}
                        >
                             小改版
                        </button>
                    </div>
                 </div>
                 
                 <div className="font-serif text-lg leading-loose text-gray-800 space-y-6">
                    {data.map((para, pIdx) => (
                        <div key={pIdx}>
                            {para.lines.map((line, lIdx) => (
                                <span key={lIdx}>
                                    {line.map((segment, sIdx) => {
                                        if (segment.type === 'del') {
                                            return <span key={sIdx} className="paper-del">{segment.text}</span>;
                                        } else if (segment.type === 'add') {
                                            return <span key={sIdx} className="paper-add">{segment.text}</span>;
                                        } else {
                                            return <span key={sIdx}>{segment.text}</span>;
                                        }
                                    })}
                                    {/* Add space between sentences if not last line */}
                                    {" "}
                                </span>
                            ))}
                        </div>
                    ))}
                 </div>

                 <div className="mt-12 pt-6 border-t border-gray-100 flex justify-end">
                    <div className="text-right">
                        <div className="text-red-600 font-handwriting text-4xl font-bold -rotate-12 inline-block border-4 border-red-600 rounded-full p-2 px-4 shadow-sm opacity-80">
                            {correctionData.score.total}
                        </div>
                        <p className="text-red-500 font-serif text-sm mt-2">Score</p>
                    </div>
                 </div>
            </div>
        );
        
        const PracticeView = ({ paperData }) => {
            const [originalText, setOriginalText] = useState('');
            
            useEffect(() => {
                // Reconstruct original text from paperData
                const text = paperData.map(para => {
                    return para.lines.map(line => {
                        return line.map(segment => {
                            if (segment.type !== 'add') {
                                return segment.text;
                            }
                            return '';
                        }).join('');
                    }).join(' ');
                }).join('\n\n');
                
                setOriginalText(text);
            }, [paperData]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(originalText);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                        <div className="bg-gray-50 px-5 py-3 border-b border-gray-100 flex justify-between items-center">
                            <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                <FileText size={18} className="text-gray-500"/> 原始文章 (Original)
                            </h3>
                            <button 
                                onClick={copyToClipboard}
                                className="text-gray-500 hover:text-blue-600 text-sm flex items-center gap-1 transition-colors"
                                title="複製原文"
                            >
                                <Copy size={16}/> 複製
                            </button>
                        </div>
                        <div className="p-6 font-serif text-lg leading-relaxed text-gray-800 whitespace-pre-wrap flex-1 overflow-y-auto">
                            {originalText}
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                         <div className="bg-blue-50 px-5 py-3 border-b border-blue-100">
                            <h3 className="font-bold text-blue-800 flex items-center gap-2">
                                <Edit3 size={18} className="text-blue-600"/> 練習區 (Practice Here)
                            </h3>
                        </div>
                        <textarea 
                            className="w-full h-96 lg:h-full p-6 font-serif text-lg leading-relaxed text-gray-800 resize-none focus:outline-none focus:bg-gray-50 transition-colors"
                            placeholder="請在此處試著重寫你的文章..."
                        ></textarea>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('minimal'); // Default to new tab: minimal, corrections, paper, final, practice
            const [paperMode, setPaperMode] = useState('full'); // 'full' or 'minimal'

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    {/* Header */}
                    <header className="text-center mb-10">
                        <h1 className="text-3xl font-bold text-gray-900 mb-2">{correctionData.title}</h1>
                        <p className="text-gray-500">作文批改與診斷報告</p>
                    </header>

                    {/* Dashboard Section */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* Total Score */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col items-center justify-center">
                            <div className="text-gray-500 font-medium mb-2">預估級分</div>
                            <div className="text-5xl font-bold text-blue-600 mb-2">{correctionData.score.total}</div>
                            <div className="text-sm text-gray-400">滿分 {correctionData.score.max}</div>
                        </div>

                        {/* Breakdown */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:col-span-2">
                            <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <BarChart2 size={20} /> 評分細項
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">
                                {correctionData.score.breakdown.map((item, idx) => (
                                    <ScoreCard key={idx} {...item} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Summary Box */}
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-8 rounded-r-lg">
                        <div className="flex items-start gap-3">
                            <Award className="text-blue-600 shrink-0 mt-1" />
                            <div>
                                <h4 className="font-bold text-blue-800 mb-1">總評</h4>
                                <p className="text-blue-800 text-opacity-80">{correctionData.summary}</p>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Tabs */}
                    <div className="mb-6 border-b border-gray-200 overflow-x-auto">
                        <div className="flex gap-6 min-w-max">
                            <button 
                                onClick={() => setActiveTab('minimal')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'minimal' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><Sparkles size={18}/> 小幅度批改</span>
                                {activeTab === 'minimal' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('corrections')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'corrections' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><BookOpen size={18}/> 完整詳解</span>
                                {activeTab === 'corrections' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('paper')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'paper' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><PenTool size={18}/> 試卷模式</span>
                                {activeTab === 'paper' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                             <button 
                                onClick={() => setActiveTab('practice')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'practice' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><Edit3 size={18}/> 自我練習</span>
                                {activeTab === 'practice' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('final')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'final' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><FileText size={18}/> 修正後範文</span>
                                {activeTab === 'final' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                        </div>
                    </div>

                    {/* Tab Content */}
                    {activeTab === 'minimal' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">最小修改・詳細批改</h2>
                                <span className="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">保留原意，只修關鍵</span>
                            </div>
                            <div>
                                {correctionData.minimalCorrections.map(item => (
                                    <CorrectionCard key={item.id} item={item} />
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'corrections' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">診斷與修正 ({correctionData.corrections.length})</h2>
                                <span className="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">完整修改版本</span>
                            </div>
                            <div>
                                {correctionData.corrections.map(item => (
                                    <CorrectionCard key={item.id} item={item} />
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {activeTab === 'paper' && (
                        <PaperView 
                            data={paperMode === 'full' ? correctionData.paperData : correctionData.minimalPaperData} 
                            paperMode={paperMode}
                            setPaperMode={setPaperMode}
                        />
                    )}
                    
                    {activeTab === 'practice' && (
                        <PracticeView paperData={correctionData.paperData} />
                    )}

                    {activeTab === 'final' && (
                        <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                            <div className="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                                <h2 className="font-bold text-gray-700">高分範文版 (Revised Version)</h2>
                                <button className="text-blue-600 text-sm font-medium hover:underline" onClick={() => navigator.clipboard.writeText(correctionData.finalText.p1 + '\n\n' + correctionData.finalText.p2)}>複製全文</button>
                            </div>
                            <div className="p-8 leading-relaxed text-gray-800 text-lg space-y-6">
                                <p>{correctionData.finalText.p1}</p>
                                <p>{correctionData.finalText.p2}</p>
                            </div>
                            <div className="bg-blue-50 px-6 py-4 border-t border-blue-100">
                                <p className="text-sm text-blue-800">💡 <strong>小提示：</strong> 閱讀範文時，請特別注意轉折詞 (On the one hand, Furthermore) 與動詞時態的使用。</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
