<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAT 弱點擊破實驗室 v3.2 (Hard Mode)</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 引入 Babel 用來解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 自定義樣式動畫 -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .animate-fade-in-up {
            animation: fadeIn 0.6s ease-out forwards;
        }
        /* 自定義捲軸 (Dark Mode) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖標元件 ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                AlertTriangle: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
                CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>,
                XCircle: <g><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></g>,
                Target: <g><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                Brain: <g><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></g>,
                RefreshCw: <g><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></g>,
                ChevronRight: <polyline points="9 18 15 12 9 6"/>,
                BookOpen: <g><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>,
                Trophy: <g><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17"/><path d="M14 14.66V17"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/><path d="M8.5 22v-2.26a1.99 1.99 0 0 1 .63-1.48 4 4 0 0 1 5.74 0 1.99 1.99 0 0 1 .63 1.48V22"/></g>,
                RotateCcw: <g><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></g>,
                PenTool: <g><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></g>,
                MessageCircle: <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        // --- 主應用程式 ---
        const WeaknessDrillApp = () => {
            const [activeWeakness, setActiveWeakness] = useState(null); 
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showExplanation, setShowExplanation] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [currentDrillSet, setCurrentDrillSet] = useState([]); 

            // 模擬進度
            const [masteryLevel, setMasteryLevel] = useState({
                'grammar': 15,
                'structure': 5,
                'collocation': 10,
                'style': 0
            });

            // 1. 弱點資料庫 (描述升級)
            const weaknesses = [
                {
                    id: 'grammar',
                    title: '文法準確度 (Grammar)',
                    description: '專攻：長難句中的主動一致性。當主詞與動詞被一長串修飾語隔開時，你能一眼看穿嗎？',
                    errorExample: 'The analysis of samples suggest...',
                    correctExample: 'The analysis ... suggests...',
                    severity: 'Critical', 
                    color: 'bg-rose-500', 
                    textColor: 'text-rose-400',
                    borderColor: 'border-rose-500/50',
                    icon: 'AlertTriangle'
                },
                {
                    id: 'structure',
                    title: '句構與邏輯 (Structure)',
                    description: '拒絕破碎句！練習使用分詞構句與關係子句來串接複雜的邏輯因果，展現學術寫作的連貫性。',
                    errorExample: 'Rain heavy. Class cancel.',
                    correctExample: 'Heavy rain falling, class was...',
                    severity: 'High',
                    color: 'bg-blue-500',
                    textColor: 'text-blue-400',
                    borderColor: 'border-blue-500/50',
                    icon: 'PenTool'
                },
                {
                    id: 'collocation',
                    title: '高階搭配詞 (Collocations)',
                    description: '拋棄國中片語。學習學測/指考等級的固定搭配，如「採取措施」、「造成威脅」、「致力於」。',
                    errorExample: 'do things to stop',
                    correctExample: 'adopt measures to curb',
                    severity: 'High',
                    color: 'bg-orange-500',
                    textColor: 'text-orange-400',
                    borderColor: 'border-orange-500/50',
                    icon: 'Brain'
                },
                {
                    id: 'style',
                    title: '正式文體 (Formal Style)',
                    description: '單字升級！將口語詞彙替換為 Level 4-6 的高階單字。Ex: huge -> substantial, bad -> detrimental。',
                    errorExample: 'very big problem',
                    correctExample: 'substantial issue',
                    severity: 'Medium',
                    color: 'bg-purple-500',
                    textColor: 'text-purple-400',
                    borderColor: 'border-purple-500/50',
                    icon: 'MessageCircle'
                }
            ];

            // 2. 題庫 (難度升級：學測/指考等級單字)
            const fullQuestionDatabase = {
                'grammar': [
                    { q: "The detailed analysis of the extensive data gathered from various sources ______ further investigation.", options: ["require", "requires"], ans: "requires", explanation: "主詞核心是 Analysis (單數)，中間的 of...sources 都是修飾語。Analysis requires..." },
                    { q: "Neither the professor nor his research assistants ______ with the controversial conclusion.", options: ["agrees", "agree"], ans: "agree", explanation: "Neither...nor 動詞看最近的主詞 (assistants 複數)。Vocab: controversial (有爭議的)。" },
                    { q: "A variety of environmental factors ______ to the rapid decline of the species.", options: ["contributes", "contribute"], ans: "contribute", explanation: "A variety of + 複數名詞，動詞通常用複數。Vocab: decline (衰退)。" },
                    { q: "The criteria for selecting the scholarship recipients ______ extremely strict.", options: ["is", "are"], ans: "are", explanation: "Criteria 是 Criterion 的複數形！这是學測常考陷阱。Vocab: recipient (受獎者)。" },
                    { q: "Establishing a routine for daily exercise ______ discipline and perseverance.", options: ["demand", "demands"], ans: "demands", explanation: "動名詞 Establishing 當主詞，視為單數。Vocab: perseverance (毅力)。" },
                    { q: "The statistics provided by the World Health Organization ______ alarming.", options: ["is", "are"], ans: "are", explanation: "Statistics 當「統計數據」時用複數；當「統計學」時用單數。這裡指數據。Vocab: alarming (令人擔憂的)。" },
                    { q: "Every candidate who passes the preliminary rounds ______ eligible for the finals.", options: ["is", "are"], ans: "is", explanation: "Every + 單數名詞。Vocab: preliminary (初賽的), eligible (有資格的)。" },
                    { q: "One of the most prominent features of this architecture ______ its sustainability.", options: ["remains", "remain"], ans: "remains", explanation: "主詞是 One。Vocab: prominent (顯著的), sustainability (永續性)。" },
                    { q: "The phenomenon of global warming and climate change ______ urgent attention.", options: ["warrant", "warrants"], ans: "warrants", explanation: "Phenomenon (現象) 是單數。Vocab: warrant (視為必要/擔保)。" },
                    { q: "Not only the students but also the instructor ______ reluctant to leave.", options: ["was", "were"], ans: "was", explanation: "Not only...but also 動詞看 instructor (單數)。Vocab: reluctant (不情願的)。" }
                ],
                'structure': [
                    { q: "The government implemented new policies, ______ to stimulate the stagnant economy.", options: ["aimed", "aiming"], ans: "aiming", explanation: "分詞構句：政府(主動) 意圖 (aiming) 去刺激經濟。Vocab: stagnant (停滯的)。" },
                    { q: "______ by the noise from the construction site, the students couldn't concentrate.", options: ["Distracting", "Distracted"], ans: "Distracted", explanation: "被動分詞構句：學生「被」干擾。Vocab: construction site (工地)。" },
                    { q: "The scientist, ______ research was published in Nature, received an award.", options: ["who", "whose"], ans: "whose", explanation: "科學家的研究 -> 所有格 whose。Vocab: renowned (著名的)。" },
                    { q: "Technology has advanced rapidly, ______ the way we communicate.", options: ["transformed", "transforming"], ans: "transforming", explanation: "結果分詞構句：科技進步，(主動)改變了溝通方式。Vocab: transform (徹底改變)。" },
                    { q: "We visited the museum, ______ ancient artifacts are preserved.", options: ["which", "where"], ans: "where", explanation: "在博物館裡 (in which) -> where。Vocab: artifacts (文物)。" },
                    { q: "There is a growing tendency ______ young people to delay marriage.", options: ["for", "of"], ans: "for", explanation: "A tendency for sb to do sth (某人做某事的趨勢)。" },
                    { q: "______ the difficulty of the task, he persisted in completing it.", options: ["Although", "Despite"], ans: "Despite", explanation: "Despite + 名詞 (difficulty)；Although + 子句。Vocab: persist (堅持)。" },
                    { q: "The sheer volume of traffic, ______ congestion, is a major issue.", options: ["causing", "caused"], ans: "causing", explanation: "交通量 (主動) 造成 壅塞。Vocab: congestion (壅塞)。" },
                    { q: "Those ______ in the workshop must register by Friday.", options: ["interested", "interesting"], ans: "interested", explanation: "Those (who are) interested... 感到興趣的人。" },
                    { q: "He is the candidate ______ qualifications are most impressive.", options: ["who", "whose"], ans: "whose", explanation: "候選人的資格 -> whose qualifications。" }
                ],
                'collocation': [
                    { q: "We must ______ immediate measures to mitigate the environmental damage.", options: ["do", "adopt"], ans: "adopt", explanation: "Adopt/Take measures (採取措施)。Mitigate (減輕) 是高級字。" },
                    { q: "Excessive use of smartphones may ______ a threat to your vision.", options: ["pose", "make"], ans: "pose", explanation: "Pose a threat/risk (造成威脅/風險)。" },
                    { q: "The organization is ______ to protecting endangered species.", options: ["dedicated", "wanted"], ans: "dedicated", explanation: "Be dedicated/devoted to + V-ing (致力於)。Endangered (瀕危的)。" },
                    { q: "Parents should ______ a good example for their children.", options: ["make", "set"], ans: "set", explanation: "Set an example (樹立榜樣)。" },
                    { q: "He ______ a crucial role in the negotiation process.", options: ["played", "made"], ans: "played", explanation: "Play a role in (扮演...角色)。Crucial (關鍵的)。" },
                    { q: "It is essential to ______ a balance between work and life.", options: ["strike", "hit"], ans: "strike", explanation: "Strike a balance (取得平衡)。" },
                    { q: "The heavy rain ______ havoc on the city's transportation.", options: ["wreaked", "caused"], ans: "wreaked", explanation: "Wreak havoc on (對...造成嚴重破壞) 是極佳的寫作片語。" },
                    { q: "We should ______ emphasis on character education.", options: ["place", "give"], ans: "place", explanation: "Place/Lay emphasis on (重視/強調)。" },
                    { q: "The new policy ______ into effect next month.", options: ["comes", "goes"], ans: "comes", explanation: "Come into effect (生效)。" },
                    { q: "Please ______ my advice into consideration before deciding.", options: ["take", "bring"], ans: "take", explanation: "Take...into consideration (將...納入考量)。" }
                ],
                'style': [
                    { q: "The impact of the policy was ______.", options: ["very big", "substantial"], ans: "substantial", explanation: "Substantial (巨大的/實質的) 比 big 正式。Similar: significant, considerable。" },
                    { q: "Lack of sleep can be ______ to your health.", options: ["bad", "detrimental"], ans: "detrimental", explanation: "Detrimental (有害的) 是 bad 的高級替換字。" },
                    { q: "Many students ______ to achieve academic excellence.", options: ["want", "aspire"], ans: "aspire", explanation: "Aspire to (渴望/立志) 比 want 更具野心與正式感。" },
                    { q: "The factory emits ______ gases.", options: ["poisonous", "toxic"], ans: "toxic", explanation: "Toxic 或 Hazardous 在學術情境比 Poisonous 常見。" },
                    { q: "This argument is ______.", options: ["wrong", "flawed"], ans: "flawed", explanation: "Flawed (有缺陷的) 用來指稱論點比 wrong 更精確。" },
                    { q: "The problem is ______ complex.", options: ["very", "extremely"], ans: "extremely", explanation: "Extremely, excessively, highly 都比 very 好。" },
                    { q: "We need to ______ the problem immediately.", options: ["fix", "address"], ans: "address", explanation: "Address (處理/應對) 問題，比 fix (修理) 更適合抽象問題。" },
                    { q: "The results ______ that the hypothesis was correct.", options: ["show", "indicate"], ans: "indicate", explanation: "Indicate (顯示/指出) 或 Demonstrate 比 show 正式。" },
                    { q: "He is ______ to change his mind.", options: ["hard", "reluctant"], ans: "reluctant", explanation: "Reluctant (不情願的) 描述態度。" },
                    { q: "Water is ______ for survival.", options: ["needed", "indispensable"], ans: "indispensable", explanation: "Indispensable (不可或缺的) 是必背 Level 5 單字。" }
                ]
            };

            const shuffleArray = (array) => {
                let newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            const startDrill = (weaknessId) => {
                const allQuestions = fullQuestionDatabase[weaknessId];
                const randomSet = shuffleArray(allQuestions).slice(0, 10);
                setCurrentDrillSet(randomSet);
                setActiveWeakness(weaknessId);
                setCurrentQuestionIndex(0);
                setScore(0);
                setShowExplanation(false);
                setSelectedOption(null);
            };

            const handleAnswer = (option) => {
                setSelectedOption(option);
                setShowExplanation(true);
                const currentQ = currentDrillSet[currentQuestionIndex];
                if (option === currentQ.ans) {
                    setScore(s => s + 1);
                    setMasteryLevel(prev => ({
                        ...prev,
                        [activeWeakness]: Math.min(100, prev[activeWeakness] + 10)
                    }));
                }
            };

            const nextQuestion = () => {
                if (currentQuestionIndex < currentDrillSet.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setShowExplanation(false);
                    setSelectedOption(null);
                } else {
                    setActiveWeakness(null);
                }
            };

            const retryDrill = () => {
                startDrill(activeWeakness);
            };

            // UI: 診斷頁面 (Dark Mode 調整)
            const DiagnosisView = () => (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-8 rounded-2xl shadow-2xl border border-slate-700 relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-3xl font-black mb-3 flex items-center gap-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                                <Icon name="Brain" size={32} className="text-indigo-400" />
                                寫作弱點特訓
                                <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded border border-indigo-500/30 ml-2">v3.2 HARD</span>
                            </h2>
                            <p className="text-slate-300 max-w-lg leading-relaxed">
                                澤享，這是學測衝刺模式。
                                <br/>題目已升級為 Level 4-6 高階單字與長難句。請選擇防禦區域開始演練。
                            </p>
                        </div>
                        {/* 裝飾光暈 */}
                        <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-4">
                        {weaknesses.map(w => (
                            <button
                                key={w.id}
                                onClick={() => startDrill(w.id)}
                                className={`text-left bg-slate-900 border ${w.borderColor} p-6 rounded-xl hover:bg-slate-800 hover:shadow-[0_0_20px_rgba(99,102,241,0.15)] hover:-translate-y-1 transition-all group relative overflow-hidden`}
                            >
                                {/* 左側彩色條 */}
                                <div className={`absolute top-0 left-0 w-1 h-full ${w.color} shadow-[0_0_10px_currentColor]`}></div>
                                
                                <div className="flex justify-between items-start mb-5 pl-4">
                                    <h3 className={`font-bold text-xl group-hover:text-white transition-colors flex items-center gap-2 ${w.textColor}`}>
                                        <div className="opacity-80"><Icon name={w.icon} size={22} /></div>
                                        {w.title}
                                    </h3>
                                    <div className="flex flex-col items-end">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Mastery</span>
                                        <div className="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div 
                                                className={`h-full ${w.color} shadow-[0_0_8px_currentColor] transition-all duration-1000`} 
                                                style={{width: `${masteryLevel[w.id]}%`}}
                                            ></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="pl-4 space-y-3">
                                <div className="bg-rose-950/30 text-rose-300 px-3 py-2 rounded-lg text-sm font-mono flex items-center gap-3 border border-rose-900/50">
                                    <div className="flex-shrink-0 text-rose-500"><Icon name="XCircle" size={16} /></div> 
                                    <span className="opacity-90">{w.errorExample}</span>
                                </div>
                                <div className="bg-emerald-950/30 text-emerald-300 px-3 py-2 rounded-lg text-sm font-mono flex items-center gap-3 border border-emerald-900/50">
                                    <div className="flex-shrink-0 text-emerald-500"><Icon name="CheckCircle" size={16} /></div>
                                    <span className="opacity-90 font-bold">{w.correctExample}</span>
                                </div>
                                </div>
                                
                                {/* Hover 提示 */}
                                <div className="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity text-indigo-400 text-sm font-bold flex items-center gap-1">
                                    Start <Icon name="ChevronRight" size={16} />
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            );

            // UI: 特訓頁面 (Dark Mode 調整)
            const DrillView = () => {
                const question = currentDrillSet[currentQuestionIndex];
                if (!question) return <div className="p-8 text-center text-slate-400">載入戰術模擬中...</div>;

                const weaknessInfo = weaknesses.find(w => w.id === activeWeakness);
                const progressPercent = ((currentQuestionIndex) / currentDrillSet.length) * 100;

                return (
                    <div className="max-w-3xl mx-auto animate-fade-in pb-12">
                        <div className="mb-8">
                            <button 
                                onClick={() => setActiveWeakness(null)}
                                className="text-slate-400 hover:text-white text-sm font-bold flex items-center gap-2 mb-6 transition-colors group"
                            >
                                <span className="group-hover:-translate-x-1 transition-transform">←</span> 放棄本次演練
                            </button>
                            
                            <div className="flex items-center justify-between mb-3">
                                <span className={`text-xs font-black px-2 py-1 rounded text-slate-950 ${weaknessInfo.color} uppercase tracking-wider shadow-[0_0_10px_currentColor]`}>
                                    {weaknessInfo.title}
                                </span>
                                <span className="text-slate-400 text-sm font-mono font-bold">
                                    <span className="text-white text-lg">{currentQuestionIndex + 1}</span> / {currentDrillSet.length}
                                </span>
                            </div>
                            <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div className="bg-indigo-500 h-full transition-all duration-300 shadow-[0_0_10px_#6366f1]" style={{width: `${progressPercent}%`}}></div>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden relative">
                            {/* 觀念提醒 */}
                            <div className="bg-slate-800/50 p-6 border-b border-slate-700 flex gap-4 backdrop-blur-sm">
                                <div className="bg-slate-700/50 p-2.5 rounded-xl h-fit border border-slate-600">
                                    <div className="text-indigo-400"><Icon name="BookOpen" size={24} /></div>
                                </div>
                                <div>
                                    <span className="font-bold text-slate-300 block mb-1 text-xs uppercase tracking-wider">Tactical Briefing (教練提示)</span>
                                    <p className="text-slate-200 text-sm leading-relaxed">{weaknessInfo.description}</p>
                                </div>
                            </div>

                            <div className="p-6 md:p-10">
                                <h3 className="text-xl md:text-2xl font-bold text-white mb-10 leading-relaxed font-serif tracking-wide">
                                    {question.q.split('______').map((part, i) => (
                                        <React.Fragment key={i}>
                                            {part}
                                            {i < question.q.split('______').length - 1 && (
                                                <span className="inline-block w-24 border-b-4 border-indigo-500/50 mx-2 animate-pulse"></span>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </h3>

                                <div className="grid grid-cols-1 gap-4">
                                    {question.options.map((opt) => {
                                        let btnStyle = "p-5 rounded-xl border-2 text-lg font-medium transition-all text-left flex justify-between items-center group relative overflow-hidden ";
                                        
                                        if (showExplanation) {
                                            if (opt === question.ans) btnStyle += "border-emerald-500 bg-emerald-950/30 text-emerald-300 shadow-[0_0_15px_rgba(16,185,129,0.2)]";
                                            else if (opt === selectedOption) btnStyle += "border-rose-500 bg-rose-950/30 text-rose-300 opacity-60";
                                            else btnStyle += "border-slate-800 bg-slate-900/50 text-slate-500";
                                        } else {
                                            btnStyle += "border-slate-700 bg-slate-800/50 hover:border-indigo-500 hover:bg-slate-800 hover:text-white text-slate-300 hover:shadow-[0_0_15px_rgba(99,102,241,0.2)]";
                                        }

                                        return (
                                            <button
                                                key={opt}
                                                disabled={showExplanation}
                                                onClick={() => handleAnswer(opt)}
                                                className={btnStyle}
                                            >
                                                <span className="font-serif relative z-10">{opt}</span>
                                                {showExplanation && opt === question.ans && <div className="text-emerald-400"><Icon name="CheckCircle" size={24} /></div>}
                                                {showExplanation && opt === selectedOption && opt !== question.ans && <div className="text-rose-400"><Icon name="XCircle" size={24} /></div>}
                                                {!showExplanation && <div className="w-5 h-5 rounded-full border-2 border-slate-600 group-hover:border-indigo-400 transition-colors"></div>}
                                            </button>
                                        );
                                    })}
                                </div>

                                {showExplanation && (
                                    <div className="mt-10 animate-fade-in-up">
                                        <div className={`p-6 rounded-xl mb-8 border-l-4 shadow-lg ${selectedOption === question.ans ? 'bg-emerald-950/30 border-emerald-500 text-emerald-100' : 'bg-rose-950/30 border-rose-500 text-rose-100'}`}>
                                            <h4 className={`font-bold flex items-center gap-2 mb-2 text-lg ${selectedOption === question.ans ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {selectedOption === question.ans ? <><Icon name="Trophy" size={20} /> Target Neutralized (正確!) </> : <><Icon name="AlertTriangle" size={20} /> Error Detected (陷阱解析)</>}
                                            </h4>
                                            <p className="opacity-90 leading-relaxed text-base border-t border-white/10 pt-2 mt-2">{question.explanation}</p>
                                        </div>
                                        
                                        {currentQuestionIndex < currentDrillSet.length - 1 ? (
                                            <button onClick={nextQuestion} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-500 transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)] flex justify-center items-center gap-2 transform hover:scale-[1.01] active:scale-[0.99]">
                                            下一題 (Next Drill) <Icon name="ChevronRight" size={20} />
                                            </button>
                                        ) : (
                                            <div className="flex gap-4">
                                                <button onClick={retryDrill} className="flex-1 bg-transparent border-2 border-slate-600 text-slate-300 py-4 rounded-xl font-bold hover:border-indigo-400 hover:text-white transition-all flex justify-center items-center gap-2">
                                                <Icon name="RotateCcw" size={20} /> 重刷本關
                                                </button>
                                                <button onClick={() => setActiveWeakness(null)} className="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-500 transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)] flex justify-center items-center gap-2">
                                                任務完成 (Finish) <Icon name="Trophy" size={20} />
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 p-4 md:p-8 font-sans bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
                    <div className="max-w-4xl mx-auto">
                        <header className="mb-10 flex items-center gap-4 border-b border-slate-800 pb-8">
                            <div className="bg-slate-800 p-3.5 rounded-2xl text-indigo-400 shadow-lg border border-slate-700">
                                <Icon name="Zap" size={32} />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-white tracking-tight flex items-center gap-3">
                                    GSAT 弱點擊破實驗室 
                                    <span className="text-xs font-bold bg-indigo-600 text-white px-2 py-0.5 rounded shadow-[0_0_10px_#4f46e5]">v3.2 HARD</span>
                                </h1>
                                <p className="text-slate-400 text-sm font-medium mt-1">Targeted Error Correction System // Level 4-6 Vocabulary</p>
                            </div>
                        </header>

                        <main>
                            {activeWeakness ? <DrillView /> : <DiagnosisView />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeaknessDrillApp />);
    </script>
</body>
</html>
