<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗺️ 英文作文學習地圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08091a;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.09);
      --text: #e2e8f0;
      --muted: #64748b;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 40% at 15% 50%, rgba(59,130,246,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 20%, rgba(168,85,247,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 80%, rgba(236,72,153,0.08) 0%, transparent 70%);
      min-height: 100vh;
      color: var(--text);
      padding-bottom: 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 52px 24px 40px;
    }
    .header-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .header-sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .overall-box {
      display: inline-block;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 32px;
      min-width: 280px;
    }
    .overall-stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text);
      display: block;
      line-height: 1.2;
    }
    .overall-bar {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
    }
    .ov-visited {
      position: absolute; inset: 0;
      border-radius: 100px;
      background: rgba(255,255,255,0.18);
      transition: width 0.7s ease;
    }
    .ov-mastered {
      position: absolute; inset: 0;
      border-radius: 100px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
      transition: width 0.7s ease;
    }
    .ov-pct {
      text-align: right;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── Map ── */
    .map-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .stage-row {
      display: grid;
      grid-template-columns: 1fr 44px 1fr 44px 1fr;
      align-items: stretch;
    }
    .h-arrow {
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.18);
      font-size: 1.5rem;
    }
    .v-connector {
      display: flex; justify-content: flex-end;
      padding-right: 60px;
      color: rgba(255,255,255,0.18);
      font-size: 1.6rem;
      margin: 8px 0;
    }

    /* ── Stage Card ── */
    .stage-card {
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .stage-card:hover { transform: translateY(-5px); }

    .card-head {
      padding: 18px 18px 14px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .card-icon {
      width: 44px; height: 44px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-num {
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px;
    }
    .card-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .card-desc  { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .card-stars { font-size: 0.85rem; letter-spacing: 1px; flex-shrink: 0; }

    .card-body {
      padding: 0 16px 16px; flex: 1;
      display: flex; flex-direction: column;
    }

    /* Lesson list */
    .lesson-list { list-style: none; margin-bottom: 14px; flex: 1; }
    .lesson-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px; border-radius: 7px;
      font-size: 0.77rem; color: var(--muted); cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s, color 0.15s;
    }
    .lesson-item:last-child { border-bottom: none; }
    .lesson-item:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
    .lesson-item.visited  { color: #94a3b8; }
    .lesson-item.mastered { color: #86efac; }

    .sdot {
      width: 15px; height: 15px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; flex-shrink: 0; transition: all 0.2s;
    }
    .sdot.v { background: rgba(148,163,184,0.2); border-color: #64748b; }
    .sdot.m { background: #22c55e; border-color: #22c55e; color: #fff; }

    .ltxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Progress */
    .card-prog { margin-bottom: 12px; }
    .prog-labels {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; color: var(--muted); margin-bottom: 5px;
    }
    .prog-bar {
      height: 5px; background: rgba(255,255,255,0.07);
      border-radius: 100px; overflow: hidden; position: relative;
    }
    .pb-v { position:absolute; inset:0; border-radius:100px; transition:width .6s; }
    .pb-m { position:absolute; inset:0; border-radius:100px; transition:width .6s; }

    /* Action button */
    .card-btn {
      width: 100%; padding: 9px; border-radius: 9px; border: none;
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem;
      font-weight: 700; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .card-btn:hover   { opacity: 0.88; }
    .card-btn:active  { transform: scale(0.98); }

    /* Footer */
    .footer { text-align: center; margin-top: 50px; }
    .reset-btn {
      padding: 9px 22px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px; color: var(--muted); font-size: 0.78rem;
      cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
      transition: background 0.2s;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.09); }

    @media (max-width: 768px) {
      .stage-row { grid-template-columns: 1fr; }
      .h-arrow, .v-connector { display: none; }
      .stage-card { margin-bottom: 16px; }
    }
  </style>
</head>
<body>

<header class="header">
  <h1 class="header-title">🗺️ 英文作文學習地圖</h1>
  <p class="header-sub">柏宏的個人化學習路徑</p>
  <div class="overall-box">
    <div class="overall-stats">
      <div><span class="stat-value" id="sM">0</span>已掌握</div>
      <div><span class="stat-value" id="sV">0</span>已瀏覽</div>
      <div><span class="stat-value" id="sT">0</span>總課程</div>
    </div>
    <div class="overall-bar">
      <div class="ov-visited"  id="ovV" style="width:0%"></div>
      <div class="ov-mastered" id="ovM" style="width:0%"></div>
    </div>
    <div class="ov-pct" id="ovPct">計算中…</div>
  </div>
</header>

<main class="map-wrap" id="mapWrap"></main>

<div class="footer">
  <button class="reset-btn" onclick="resetAll()">🔄 重置所有學習進度</button>
</div>

<script>
const STAGES = [
  {id:1,si:0,icon:"🏗️",color:"#22c55e",title:"段落基礎",desc:"漢堡寫法、主題句、支持句",lessons:[
    {id:"l1_1",title:"Unit 1｜寫作入門",url:"first.html"},
    {id:"l1_4",title:"Unit 1｜完整精裝互動手冊",url:"0908.html"},
    {id:"l1_2",title:"Unit 5｜漢堡段落寫法",url:"Unit5.html"},
    {id:"l1_5",title:"Unit 5｜英文作文這樣寫就OK",url:"unit5_2.html"},
    {id:"l1_3",title:"腦力激盪 & 句子加長",url:"Unit2_3腦力激盪_句子加長.html"},
  ]},
  {id:2,si:1,icon:"⚙️",color:"#3b82f6",title:"句型與文法",desc:"時態、轉承詞、分詞構句",lessons:[
    {id:"l2_1",title:"英文時態懶人包",url:"英文時態懶人包.html"},
    {id:"l2_2",title:"Unit 4｜轉折詞",url:"Unit4轉折詞.html"},
    {id:"l2_3",title:"轉承詞大集合",url:"轉承詞大集合.html"},
    {id:"l2_4",title:"分詞構句",url:"分詞構句.html"},
    {id:"l2_5",title:"及物與不及物動詞",url:"及物不及物.html"},
    {id:"l2_6",title:"Who vs. Whom",url:"who-vs-whom.html"},
    {id:"l2_7",title:"動詞片語總整理",url:"動詞片語總整理.html"},
    {id:"l2_8",title:"萬用句型",url:"萬用句.html"},
    {id:"l2_9",title:"句型練習",url:"20260102/句型.html"},
    {id:"l2_10",title:"核心詞彙與句型複習",url:"0901.html"},
    {id:"l2_11",title:"學測英文文法戰略手冊",url:"20260102/翻譯和句型.html"},
    {id:"l2_12",title:"句型系統化學習地圖",url:"20251117/句型練習.html"},
    {id:"l2_13",title:"澤享文法戰術中心",url:"柏宏/index.html"},
    {id:"l2_14",title:"不定詞魔法實驗室",url:"柏宏/2.html"},
  ]},
  {id:3,si:2,icon:"🎯",color:"#a855f7",title:"題型攻略",desc:"圖表題、記敘文、描寫文",lessons:[
    {id:"l3_0",title:"學測五大題型總覽（互動完整版）",url:"0722v2.html"},
    {id:"l3_1",title:"破題法",url:"20251013/破題.html"},
    {id:"l3_2",title:"圖表題寫作技巧",url:"20251013/圖表題.html"},
    {id:"l3_3",title:"Unit 6｜敘述文",url:"Unit6.html"},
    {id:"l3_4",title:"感官描寫技巧",url:"20251013/感官描寫.html"},
    {id:"l3_5",title:"範例練習｜颱風假該不該放？",url:"0707v2.html"},
  ]},
  {id:4,si:3,icon:"🔥",color:"#f97316",title:"精準度訓練",desc:"常見錯誤、Quiz 測驗",lessons:[
    {id:"l4_1",title:"Unit 7｜弱點擊破",url:"Unit7.html"},
    {id:"l4_2",title:"寫作精準度 Quiz 一",url:"0728quiz.html"},
    {id:"l4_3",title:"寫作精準度 Quiz 二",url:"0728quiz2.html"},
    {id:"l4_4",title:"英文考題產生器",url:"英文考題產生器.html"},
    {id:"l4_5",title:"GSAT 弱點擊破 v3.1（暗色版）",url:"20251126/1.html"},
    {id:"l4_6",title:"GSAT 弱點擊破 v3.2 Hard Mode",url:"20251126/hard.html"},
    {id:"l4_7",title:"GSAT 弱點擊破 v4.0 Final Review",url:"20251126/custom.html"},
  ]},
  {id:5,si:4,icon:"✍️",color:"#ec4899",title:"實戰批改",desc:"歷次作文診斷報告",lessons:[
    {id:"l5_1",title:"範文分析",url:"範文分析.html"},
    {id:"l5_8",title:"作文批改｜表情符號的使用",url:"0728writing.html"},
    {id:"l5_9",title:"擺脫直翻｜建立英文思維（互動版）",url:"0815v2.html"},
    {id:"l5_10",title:"孝澤的作文批改合輯",url:"20251117/index.html"},
    {id:"l5_2",title:"診斷｜公園設計",url:"20251224/park.html"},
    {id:"l5_3",title:"診斷｜花園設計",url:"20251224/garden.html"},
    {id:"l5_4",title:"診斷｜Robot Helper",url:"20251224/robot.html"},
    {id:"l5_5",title:"診斷｜在家 vs 咖啡廳",url:"20251224/study.html"},
    {id:"l5_11",title:"診斷｜畢業旅行計畫",url:"20251224/index.html"},
    {id:"l5_6",title:"診斷｜Education vs Skills",url:"20260102/Educationvs.Skills.html"},
    {id:"l5_7",title:"診斷｜Technology Replacement",url:"20260111/technologyreplacement.html"},
  ]},
  {id:6,si:5,icon:"🏆",color:"#eab308",title:"模擬考",desc:"學測模擬全真挑戰",lessons:[
    {id:"l6_5",title:"學測終極戰術板（最新版）",url:"20260111/new.html"},
    {id:"l6_6",title:"學測終極戰術板（20分鐘急救版）",url:"20260102/new.html"},
    {id:"l6_1",title:"模擬考 9/8",url:"0908 test.html"},
    {id:"l6_2",title:"模擬考 9/15",url:"0915考題.html"},
    {id:"l6_3",title:"模擬考 9/22",url:"0922考題.html"},
    {id:"l6_4",title:"題庫練習",url:"題庫.html"},
  ]},
];

// ── progress helpers ─────────────────────
function gp(id){ return { v: localStorage.getItem('v_'+id)==='1', m: localStorage.getItem('m_'+id)==='1' }; }

function ss(s){
  let v=0,m=0;
  s.lessons.forEach(l=>{ const p=gp(l.id); if(p.v||p.m) v++; if(p.m) m++; });
  return {v,m,t:s.lessons.length};
}

function stars(s){
  const {v,m,t}=ss(s), mp=m/t, vp=v/t;
  return mp>=.8?3:mp>=.4||vp>=.7?2:vp>=.3||m>0?1:0;
}

function starsHtml(n,c){
  return `<span style="color:${c}">${'⭐'.repeat(n)}</span><span style="opacity:.2">${'⭐'.repeat(3-n)}</span>`;
}

function light(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>155;
}

function firstUnfinished(s){ for(let i=0;i<s.lessons.length;i++) if(!gp(s.lessons[i].id).m) return i; return 0; }

// ── card builder ─────────────────────────
function card(stage){
  const {v,m,t}=ss(stage), n=stars(stage), c=stage.color;
  const vp=t?Math.round(v/t*100):0, mp=t?Math.round(m/t*100):0;
  const fi=firstUnfinished(stage);
  const btnTxt=m===t&&t>0?'🎉 全部掌握！':m>0||v>0?'▶ 繼續學習':'▶ 開始學習';

  const rows=stage.lessons.map((l,i)=>{
    const p=gp(l.id);
    const cls=p.m?'mastered':p.v?'visited':'';
    const dot=p.m?`<div class="sdot m">✓</div>`:p.v?`<div class="sdot v">◉</div>`:`<div class="sdot"></div>`;
    return `<li class="lesson-item ${cls}" onclick="go(${stage.si},${i})">${dot}<span class="ltxt">${l.title}</span></li>`;
  }).join('');

  return `
<div class="stage-card" style="border-color:${c}2a;box-shadow:0 0 22px ${c}11">
  <div class="card-head" style="background:linear-gradient(135deg,${c}18,${c}06)">
    <div class="card-icon" style="background:${c}1e;color:${c}">${stage.icon}</div>
    <div class="card-meta">
      <div class="card-num" style="color:${c}">第 ${stage.id} 關</div>
      <div class="card-title">${stage.title}</div>
      <div class="card-desc">${stage.desc}</div>
    </div>
    <div class="card-stars">${starsHtml(n,c)}</div>
  </div>
  <div class="card-body">
    <ul class="lesson-list">
      ${rows}
    </ul>
    <div class="card-prog">
      <div class="prog-labels"><span>已掌握 ${m} / ${t}</span><span style="color:${c}">${mp}%</span></div>
      <div class="prog-bar">
        <div class="pb-v" style="width:${vp}%;background:${c}2e"></div>
        <div class="pb-m" style="width:${mp}%;background:${c}"></div>
      </div>
    </div>
    <button class="card-btn" style="background:${c};color:${light(c)?'#000':'#fff'}" onclick="go(${stage.si},${fi})">${btnTxt}</button>
  </div>
</div>`;
}

// ── render ───────────────────────────────
function render(){
  document.getElementById('mapWrap').innerHTML=`
    <div class="stage-row">
      ${card(STAGES[0])}
      <div class="h-arrow">→</div>
      ${card(STAGES[1])}
      <div class="h-arrow">→</div>
      ${card(STAGES[2])}
    </div>
    <div class="v-connector">↓</div>
    <div class="stage-row" style="direction:rtl">
      <div style="direction:ltr">${card(STAGES[5])}</div>
      <div class="h-arrow" style="direction:ltr">→</div>
      <div style="direction:ltr">${card(STAGES[4])}</div>
      <div class="h-arrow" style="direction:ltr">→</div>
      <div style="direction:ltr">${card(STAGES[3])}</div>
    </div>`;
  updateOv();
}

function updateOv(){
  let tL=0,tV=0,tM=0;
  STAGES.forEach(s=>{ const {v,m,t}=ss(s); tL+=t; tV+=v; tM+=m; });
  document.getElementById('sM').textContent=tM;
  document.getElementById('sV').textContent=tV;
  document.getElementById('sT').textContent=tL;
  const vp=tL?Math.round(tV/tL*100):0, mp=tL?Math.round(tM/tL*100):0;
  document.getElementById('ovV').style.width=vp+'%';
  document.getElementById('ovM').style.width=mp+'%';
  document.getElementById('ovPct').textContent=`已掌握 ${mp}%　已瀏覽 ${vp}%`;
}

function go(si,li){ window.location.href=`lesson.html?si=${si}&li=${li}`; }

function resetAll(){
  if(!confirm('確定要清除所有學習記錄？')) return;
  STAGES.forEach(s=>s.lessons.forEach(l=>{ localStorage.removeItem('v_'+l.id); localStorage.removeItem('m_'+l.id); }));
  render();
}

render();
</script>
</body>
</html>
