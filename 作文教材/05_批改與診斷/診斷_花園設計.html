            corrections: [
                { id: 1, original: "there must have", corrected: "there are usually", explanation: "句型錯誤。表示「有...」應使用 'There is/are'，不能用 'There have'。", type: "Grammar" },

                { id: 3, original: "terrific", corrected: "beautiful", explanation: "選詞精準度。'Terrific' 語氣強烈且較口語，描述花園用 'beautiful' 或 'attractive' 較自然。", type: "Vocab" },

                { id: 5, original: "paly", corrected: "play", explanation: "拼字錯誤。", type: "Spelling" },
                { id: 6, original: "take a snap", corrected: "take photos", explanation: "搭配詞。'Take a snap' 較不自然，考試寫作建議用標準的 'take photos'。", type: "Vocab" },
                { id: 7, original: "Everyone enjoy... come", corrected: "Everyone enjoys... comes", explanation: "主動詞一致性。Everyone 是單數代名詞，動詞需加 s。", type: "Grammar" },
                { id: 8, original: "rule on the sign", corrected: "rule written on the sign", explanation: "語意完整性。加上 'written' (寫在...上) 會讓描述更清楚。", type: "Structure" },
                { id: 9, original: "demostrate", corrected: "demonstrates", explanation: "拼字與單數動詞。拼字應為 demonstrate，且主詞 It 為單數。", type: "Spelling" },
                { id: 10, original: "opt to neglect", corrected: "choose to ignore", explanation: "搭配詞。'Opt to neglect' 聽起來很生硬，'choose to ignore' 是最自然的說法。", type: "Vocab" },
                { id: 11, original: "must lost", corrected: "will lose", explanation: "助動詞後接原形。Must/Will 後面動詞要還原，lost 是過去式/分詞，原形是 'lose'。此處語意用 'will' (將會) 較好。", type: "Grammar" },
                { id: 12, original: "damage get", corrected: "damage really gets", explanation: "主動詞一致性。Damage 是不可數單數，動詞用 gets。", type: "Grammar" },

                { id: 14, original: "every people", corrected: "everyone / the visitors", explanation: "文法錯誤。People 是複數，不能用 every (接單數)。可用 'everyone' 或 'all the people'。", type: "Grammar" },
                { id: 15, original: "masterpiece", corrected: "work / creation", explanation: "語氣。'Masterpiece' (傑作) 自稱顯得太自負，用 'work' (心血/作品) 較恰當。", type: "Vocab" },
                { id: 16, original: "put the fence beside", corrected: "put up a fence around", explanation: "片語搭配。架設圍籬用 'put up'，且是圍繞花園用 'around'。", type: "Vocab" },
                { id: 17, original: "Despite ... but", corrected: "Although ...", explanation: "連接詞錯誤。Despite 是介系詞，不能接子句也不能跟 but 連用。改用 Although 引導子句。", type: "Grammar" },

            finalText: {
                p1: "When we visit tourist attractions, there are usually some signs or rules to prevent the environment from being damaged. The picture shows a beautiful garden where the flowers are in full bloom. Many tourists are attracted to the garden because of its scenery. The children play with each other in the garden. At the same time, many couples take photos together. Everyone enjoys the pleasure that comes from the gorgeous atmosphere and scenery. Nonetheless, they forget one crucial thing. They don't follow the rule written on the sign. It demonstrates a clear statement: \"Tourists can't walk into the garden, but taking pictures is allowed.\" Maybe some people do notice it; however, they choose to ignore it. In this way, the garden will lose its beauty one day.",

        const ScoreCard = ({ label, score, max, status }) => {
            const width = (score / max) * 100 + '%';
            return (
                <div className="mb-4">
                    <div className="flex justify-between text-sm font-medium mb-1 text-gray-700">

                </div>
            );

                    <div className="flex-1">

        const PaperView = ({ data }) => (

                    return para.lines.map(line => {
                        return line.map(segment => {
                            if (segment.type !== 'add') {
                                return segment.text;
                            }
                            return '';
                        }).join('');
                    }).join(' ');
                }).join('\n\n');
                
                setOriginalText(text);
            }, [paperData]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(originalText);
            };

            return (

                            >

                        <div className="p-6 font-serif text-lg leading-relaxed text-gray-800 whitespace-pre-wrap flex-1 overflow-y-auto">

                            className="w-full h-96 lg:h-full p-6 font-serif text-lg leading-relaxed text-gray-800 resize-none focus:outline-none focus:bg-gray-50 transition-colors"
                            placeholder="請在此處試著重寫你的文章..."

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    {/* Header */}

                        <p className="text-gray-500">作文批改與診斷報告</p>
                    </header>

                    {/* Dashboard Section */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* Total Score */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col items-center justify-center">
                            <div className="text-gray-500 font-medium mb-2">預估級分</div>
                            <div className="text-5xl font-bold text-blue-600 mb-2">{correctionData.score.total}</div>
                            <div className="text-sm text-gray-400">滿分 {correctionData.score.max}</div>
                        </div>

                        {/* Breakdown */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:col-span-2">
                            <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <BarChart2 size={20} /> 評分細項
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">
                                {correctionData.score.breakdown.map((item, idx) => (
                                    <ScoreCard key={idx} {...item} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Summary Box */}
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-8 rounded-r-lg">
                        <div className="flex items-start gap-3">
                            <Award className="text-blue-600 shrink-0 mt-1" />
                            <div>
                                <h4 className="font-bold text-blue-800 mb-1">總評</h4>
                                <p className="text-blue-800 text-opacity-80">{correctionData.summary}</p>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Tabs */}
                    <div className="mb-6 border-b border-gray-200 overflow-x-auto">
                        <div className="flex gap-6 min-w-max">
                            <button 
                                onClick={() => setActiveTab('corrections')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'corrections' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><BookOpen size={18}/> 逐句批改診斷</span>
                                {activeTab === 'corrections' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('paper')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'paper' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><PenTool size={18}/> 試卷批改模式</span>
                                {activeTab === 'paper' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                             <button 
                                onClick={() => setActiveTab('practice')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'practice' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><Edit3 size={18}/> 自我練習模式</span>
                                {activeTab === 'practice' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                            <button 
                                onClick={() => setActiveTab('final')}
                                className={`pb-3 px-1 font-medium transition-colors relative whitespace-nowrap ${activeTab === 'final' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <span className="flex items-center gap-2"><FileText size={18}/> 修正後範文</span>
                                {activeTab === 'final' && <div className="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600"></div>}
                            </button>
                        </div>
                    </div>

                    {/* Tab Content */}
                    {activeTab === 'corrections' && (
                        <div className="space-y-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">診斷與修正 ({correctionData.corrections.length})</h2>
                                <span className="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">紅色為原文錯誤，綠色為修正建議</span>
                            </div>
                            <div>
                                {correctionData.corrections.map(item => (
                                    <CorrectionCard key={item.id} item={item} />
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {activeTab === 'paper' && (
                        <PaperView data={correctionData.paperData} />
                    )}
                    
                    {activeTab === 'practice' && (
                        <PracticeView paperData={correctionData.paperData} />
                    )}

                    {activeTab === 'final' && (
                        <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                            <div className="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                                <h2 className="font-bold text-gray-700">高分範文版 (Revised Version)</h2>
                                <button className="text-blue-600 text-sm font-medium hover:underline" onClick={() => navigator.clipboard.writeText(correctionData.finalText.p1 + '\n\n' + correctionData.finalText.p2)}>複製全文</button>
                            </div>
                            <div className="p-8 leading-relaxed text-gray-800 text-lg space-y-6">
                                <p>{correctionData.finalText.p1}</p>
                                <p>{correctionData.finalText.p2}</p>
                            </div>
                            <div className="bg-blue-50 px-6 py-4 border-t border-blue-100">
                                <p className="text-sm text-blue-800">💡 <strong>小提示：</strong> 閱讀範文時，請特別注意轉折詞 (On the one hand, Furthermore) 與動詞時態的使用。</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
